name: Build and Push Docker Image

on:
  push:
    # branches: ["main"]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build prod image
        run: docker build -f Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/helloworld:latest .
      
      - name: Build dev image
        run: docker build -f Dockerfile.dev -t ${{ secrets.DOCKERHUB_USERNAME }}/helloworld:dev .
      
      - name: Push images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/helloworld:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/helloworld:dev

